name: build

# Build on every push/PR so breakage is caught early, and additionally on v* tags,
# where the built .3gx is attached to a GitHub Release.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the "Attach to release" step: the default GITHUB_TOKEN is read-only in
    # many repositories, and creating a Release requires write access to contents.
    permissions:
      contents: write
    # Official devkitPro image: ships devkitARM + libctru and sets $DEVKITARM.
    # devkitPro asks that CI use these images rather than running pacman directly.
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Makefile invokes a bare `3gxtool`, which is NOT part of the devkitARM image
      # (on Windows it comes from the thepixellizeross-win pacman repo, which ships no
      # Linux build). So build it from source and drop it on the image's PATH.
      #
      # It MUST be this source: 3gxtool 1.3 writes the "3GX$0002" container Luma expects.
      # The older, more findable Nanquitas/3gxtool on GitHub (last touched 2018) emits
      # "3GX$0001", which Luma rejects outright - the plugin would build fine and then
      # simply refuse to load. The "Verify artifact" step below guards against exactly that.
      #
      # --recurse-submodules is required: the build pulls in yaml-cpp and dynalo.
      - name: Build and install 3gxtool
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make git ca-certificates
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://gitlab.com/thepixellizeross/3gxtool.git /tmp/3gxtool
          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3gxtool/build --config Release -j"$(nproc)"
          install -m755 "$(find /tmp/3gxtool/build -name '3gxtool' -type f -perm -u+x | head -n1)" \
            /opt/devkitpro/tools/bin/3gxtool
          3gxtool | head -n 3

      # NOT parallel: the devkitPro Makefile template recurses into build/ and its link rule
      # races the compile rules under -j, so `make -j` intermittently fails with
      # "cannot find main.o". It is five source files - serial costs nothing.
      - name: Build the template
        run: make

      # Second artifact from the same tree: the universal build, for Luma's default.3gx slot.
      # Only the TOOLS_ONLY switch and the on-screen name differ - sed them, rebuild, restore.
      - name: Build the tools-only variant (default.3gx)
        run: |
          set -eux
          cp Sources/main.c /tmp/main.c.orig
          # ONE edit: PLUGIN_NAME and PLUGIN_TAG follow TOOLS_ONLY in the source.
          sed -i 's/^#define TOOLS_ONLY 0$/#define TOOLS_ONLY 1/' Sources/main.c
          grep -q '^#define TOOLS_ONLY 1' Sources/main.c   # fail loudly if the sed missed
          make clean
          make
          mv CTRComposer-BlankTemplate.3gx default.3gx
          cp /tmp/main.c.orig Sources/main.c
          make clean
          make

      - name: Verify artifacts
        run: |
          set -eux
          ls -l CTRComposer-BlankTemplate.3gx default.3gx
          for f in CTRComposer-BlankTemplate.3gx default.3gx; do
            # Luma3DS only accepts the 3GX$0002 container; fail loudly on 3GX$0001.
            head -c 8 "$f" | grep -q '3GX\$0002'
          done
          # The universal build must not carry menus it does not have.
          for s in Tracker 'Game Guide' 'Example:'; do
            if grep -qa "$s" default.3gx; then echo "default.3gx still mentions: $s" >&2; exit 1; fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CTRComposer
          path: |
            CTRComposer-BlankTemplate.3gx
            default.3gx
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CTRComposer-BlankTemplate.3gx
            default.3gx
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
